<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760" role="img" aria-labelledby="title desc">
  <title id="title">EveryShift automatic schedule result preview</title>
  <desc id="desc">Edited schedule result table showing multiple nurses, dates, D, E, N, and O assignments with daily staffing totals.</desc>
  <defs>
    <style>
      .bg{fill:#ffffff}
      .outer{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.2}
      .head{fill:#f8fafc}
      .grid{stroke:#cbd5e1;stroke-width:1}
      .grid-soft{stroke:#e2e8f0;stroke-width:1}
      .text{font-family:Inter,Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#111827}
      .muted{fill:#64748b}
      .small{font-size:13px}
      .tiny{font-size:11px}
      .name{font-size:12px;font-weight:700}
      .header{font-size:12px;font-weight:700}
      .total{font-size:12px;font-weight:700}
      .cell-text{font-size:12px;font-weight:800}
      .d{fill:#dcfce7;stroke:#86efac}
      .e{fill:#ffedd5;stroke:#fdba74}
      .n{fill:#dbeafe;stroke:#93c5fd}
      .o{fill:#ffffff;stroke:#cbd5e1}
      .warn{fill:#ffffff;stroke:#ef4444;stroke-width:2}
      .dot{fill:#5b21b6}
      .bar{fill:#6ee7b7}
    </style>
