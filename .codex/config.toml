[mcp_servers.shrimp_task_manager]
command = "node"
args = [
  "/home/brown/projects/every-shift-mvp/tools/mcp-shrimp-task-manager/dist/index.js"
]

env = {
  # Shrimp의 상태/데이터 저장 경로 (프로젝트 내부에 저장되도록 구성)
